name: lanweave
arch: amd64
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: lanweave <noreply@lanweave.local>
description: |
  lanweave VPN relay server.
  A lightweight C/S VPN relay: WireGuard tunnels + nftables zone isolation,
  managed as a systemd service.
license: proprietary

# openssl: post-install generates the self-signed certificate and the random
#   per-install secrets so the service starts out of the box.
# jq, sqlite3: used by /usr/local/bin/lanweavectl (admin helper) to talk to the
#   local API and resolve usernames from the database.
depends:
  - openssl
  - jq
  - sqlite3

contents:
  - src: ./lanweaved
    dst: /usr/bin/lanweaved
    file_info:
      mode: 0755
  - src: ./config.toml.example
    dst: /etc/lanweave/config.toml.example
    type: config
    file_info:
      mode: 0644
  - src: ./deploy/systemd/lanweaved.service
    dst: /lib/systemd/system/lanweaved.service
    file_info:
      mode: 0644
  - src: ./packaging/scripts/lanweavectl.sh
    dst: /usr/local/bin/lanweavectl
    file_info:
      mode: 0755

scripts:
  postinstall: ./packaging/scripts/postinstall.sh
  preremove: ./packaging/scripts/preremove.sh
  postremove: ./packaging/scripts/postremove.sh
